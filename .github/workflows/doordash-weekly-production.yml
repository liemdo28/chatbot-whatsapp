name: doordash-weekly-production

on:
  schedule:
    - cron: '5 18 * * 0'
  workflow_dispatch:
    inputs:
      store_ids:
        description: Comma-separated store ids
        required: false
        type: string
      week_start:
        description: ISO week start override (YYYY-MM-DD)
        required: false
        type: string
      week_end_exclusive:
        description: ISO week end override (YYYY-MM-DD)
        required: false
        type: string

concurrency:
  group: doordash-weekly-production-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  weekly-production:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: doordash-campaign-agent
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: doordash-campaign-agent/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts

      - name: Build
        run: npm run build

      - name: Run validation suite
        run: |
          npm run test:weekly-window
          npm run test:production-storage
          npm run test:production-openai
          npm run test:production-ingestion
          npm run test:workflow-validation

      - name: Execute weekly production workflow
        id: workflow_run
        continue-on-error: true
        env:
          DD_EXECUTION_ENV: production
          DD_ANALYSIS_PROVIDER: openai
          DD_REPORT_SOURCE: imap
          DD_STORAGE_BACKEND: postgres
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          DATABASE_URL: ${{ secrets.DOORDASH_PRODUCTION_DATABASE_URL }}
          DD_REPORT_ALLOWED_SENDERS: ${{ secrets.DD_REPORT_ALLOWED_SENDERS }}
          IMAP_HOST: ${{ secrets.IMAP_HOST }}
          IMAP_PORT: ${{ secrets.IMAP_PORT }}
          IMAP_SECURE: ${{ secrets.IMAP_SECURE }}
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASS: ${{ secrets.IMAP_PASS }}
          DD_REPORT_INBOX_LABEL: ${{ secrets.DD_REPORT_INBOX_LABEL }}
          DD_SCHEDULER_TIMEZONE: America/Los_Angeles
        run: |
          args=("--trigger" "${{ github.event_name }}")
          if [[ -n "${{ inputs.store_ids }}" ]]; then
            args+=("--stores" "${{ inputs.store_ids }}")
          fi
          if [[ -n "${{ inputs.week_start }}" ]]; then
            args+=("--week-start" "${{ inputs.week_start }}")
          fi
          if [[ -n "${{ inputs.week_end_exclusive }}" ]]; then
            args+=("--week-end-exclusive" "${{ inputs.week_end_exclusive }}")
          fi
          npm run automation:weekly:production -- "${args[@]}"

      - name: Upload sanitized diagnostics
        if: steps.workflow_run.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: doordash-weekly-production-diagnostics
          path: doordash-campaign-agent/artifacts/weekly-production
          if-no-files-found: warn
          retention-days: 14

      - name: Create or update production issue
        if: steps.workflow_run.outcome == 'failure'
        uses: actions/github-script@v8
        with:
          script: |
            const title = 'DoorDash weekly production workflow failed';
            const runDate = new Date().toISOString().slice(0, 10);
            const body = [
              'The GitHub-hosted weekly workflow failed.',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `Workflow: ${context.workflow}`,
              `Date: ${runDate}`,
              '',
              'Sanitized diagnostics were uploaded as a workflow artifact.',
            ].join('\n');
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'doordash-production',
              per_page: 100,
            });
            const existing = issues.find(issue => issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['doordash-production'],
              });
            }

      - name: Fail job when required workflow step failed
        if: steps.workflow_run.outcome == 'failure'
        run: exit 1
